services:
  app:
    build: .
    container_name: swjtu-pixel-maker
    expose:
      - "3000"
    volumes:
      - ./appdata:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/data.db
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-tianyufang}
      - SESSION_SECRET=${SESSION_SECRET:-trpg-dot-maker-secret-key-2026}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: swjtu-pixel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
