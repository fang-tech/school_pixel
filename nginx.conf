worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	sendfile on;
	keepalive_timeout 65;
	client_max_body_size 20m;

	# 上传大文件（含捏人图片 base64）时提高缓冲
	proxy_buffers 16 64k;
	proxy_buffer_size 128k;

	# 关闭 Nginx 对 .br 文件的再压缩（它们已是 Brotli 预压缩）
	gzip off;

	# HTTP → HTTPS 强制跳转
	server {
		listen 80;
		server_name devshowcase.site www.devshowcase.site;
		return 301 https://$host$request_uri;
	}

	# HTTPS 主站
	server {
		listen 443 ssl;
		http2 on;
		server_name devshowcase.site www.devshowcase.site;

		ssl_certificate     /etc/nginx/certs/devshowcase.site.crt;
		ssl_certificate_key /etc/nginx/certs/devshowcase.site.key;

		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;
		ssl_prefer_server_ciphers on;
		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 10m;

		# 反代到 app 容器
		location / {
			proxy_pass http://app:3000;
			proxy_http_version 1.1;
			proxy_set_header Host              $host;
			proxy_set_header X-Real-IP         $remote_addr;
			proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade           $http_upgrade;
			proxy_set_header Connection        "upgrade";
			proxy_read_timeout 300s;
		}
	}
}
