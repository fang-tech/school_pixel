worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	sendfile on;
	keepalive_timeout 65;
	client_max_body_size 20m;

	# 上传大文件（含捏人图片 base64）时提高缓冲
	proxy_buffers 16 64k;
	proxy_buffer_size 128k;

	# 关闭 Nginx 对所有文件的动态压缩（.br 文件已是预压缩，不能再压）
	gzip off;

	# HTTP → HTTPS 强制跳转
	server {
		listen 80;
		server_name devshowcase.site www.devshowcase.site;
		return 301 https://$host$request_uri;
	}

	# HTTPS 主站
	server {
		listen 443 ssl;
		http2 on;
		server_name devshowcase.site www.devshowcase.site;

		ssl_certificate     /etc/nginx/certs/devshowcase.site.crt;
		ssl_certificate_key /etc/nginx/certs/devshowcase.site.key;

		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;
		ssl_prefer_server_ciphers on;
		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 10m;

		# 静态游戏资源：允许 CDN 跨域回源
		location /game/ {
			proxy_pass http://app:3000;
			proxy_http_version 1.1;
			proxy_set_header Host              $host;
			proxy_set_header X-Real-IP         $remote_addr;
			proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_read_timeout 300s;

			# 告诉上游 Express 不要做动态压缩（文件已是预压缩 .br）
			proxy_set_header Accept-Encoding "";

			# 确保上游设置的 Content-Encoding: br 原样透传给客户端/CDN
			proxy_pass_header Content-Encoding;

			add_header Access-Control-Allow-Origin  "*" always;
			add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
			add_header Access-Control-Allow-Headers "Range, Content-Type" always;
		}

		# 反代到 app 容器
		location / {
			proxy_pass http://app:3000;
			proxy_http_version 1.1;
			proxy_set_header Host              $host;
			proxy_set_header X-Real-IP         $remote_addr;
			proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade           $http_upgrade;
			proxy_set_header Connection        "upgrade";
			proxy_read_timeout 300s;
		}
	}
}
