name: Deploy to Server

on:
  push:
    branches: [main]

# 强制使用 Node.js 24，解决 deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "[1] Checkout 代码"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: "[2] 判断变更范围"
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "changed files:"
          echo "$CHANGED"
          # 是否有 web-demo/ 之外的文件变动
          NON_GAME=$(echo "$CHANGED" | grep -v '^web-demo/' | grep -v '^\.' || true)
          if [ -z "$NON_GAME" ]; then
            echo "mode=game-only" >> $GITHUB_OUTPUT
            echo "✅ 仅 web-demo 变动，走快速更新路径"
          else
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "✅ 检测到非游戏文件变动，走完整部署路径"
          fi

      - name: "[3] 配置 SSH 密钥"
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ────────────────────────────────────────────
      # 快速路径：仅游戏包体变动，直接同步文件，不重建镜像
      # ────────────────────────────────────────────
      - name: "[快速] Rsync web-demo 到服务器"
        if: steps.changes.outputs.mode == 'game-only'
        run: |
          rsync -av --delete \
            --timeout=120 \
            --exclude '.git' \
            --exclude '.DS_Store' \
            --exclude 'index.html' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || 22 }}" \
            ./web-demo/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/swjtu-pixel-maker/web-demo/
          echo "✅ web-demo 同步完成"

      - name: "[快速] 复制游戏文件进容器"
        if: steps.changes.outputs.mode == 'game-only'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 3m
          script: |
            set -e
            echo "========== 复制 web-demo 进容器 =========="
            docker cp ~/swjtu-pixel-maker/web-demo/. swjtu-pixel-maker:/app/web-demo/
            echo "========== 健康检查 =========="
            curl -sf http://localhost:3000/ && echo "✅ 服务正常" || echo "⚠️ 健康检查失败"
            echo "========== ✅ 游戏包体快速更新完成 =========="

      # ────────────────────────────────────────────
      # 完整路径：有代码/配置变动，重建 Docker 镜像
      # ────────────────────────────────────────────
      - name: "[完整] Rsync 全量推送代码到服务器"
        if: steps.changes.outputs.mode == 'full'
        run: |
          rsync -av --delete \
            --partial \
            --partial-dir=.rsync-partial \
            --delay-updates \
            --timeout=300 \
            --exclude 'node_modules' \
            --exclude 'appdata' \
            --exclude 'data.db*' \
            --exclude '.git' \
            --exclude '.DS_Store' \
            --exclude '.rsync-partial' \
            --exclude 'web-demo/index.html' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || 22 }}" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/swjtu-pixel-maker/
          echo "✅ 代码推送完成"

      - name: "[完整] 远程重建并启动容器"
        if: steps.changes.outputs.mode == 'full'
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_BUILDKIT: 1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            echo "========== 进入项目目录 =========="
            cd ~/swjtu-pixel-maker

            echo "========== 备份数据库 =========="
            mkdir -p ~/backup
            cp appdata/data.db ~/backup/data-$(date +%Y%m%d-%H%M%S).db 2>/dev/null || echo "⚠️ 无数据库备份"

            echo "========== 停止旧容器 =========="
            docker compose down 2>&1

            echo "========== 构建新镜像（带缓存）=========="
            export DOCKER_BUILDKIT=1
            docker compose build 2>&1

            echo "========== 启动新容器 =========="
            docker compose up -d 2>&1

            echo "========== 健康检查 =========="
            for i in $(seq 1 10); do
              sleep 3
              docker exec swjtu-pixel-maker node -e \
                "fetch('http://127.0.0.1:3000/maker/data/index.html').then(r=>{if(!r.ok)throw r.status;process.exit(0)}).catch(()=>process.exit(1))" \
                && echo "✅ 健康检查通过（第 ${i} 次）" && break \
                || echo "⏳ 等待服务就绪... (${i}/10)"
              if [ "$i" -eq 10 ]; then echo "❌ 健康检查失败" && exit 1; fi
            done

            echo "========== 容器状态 =========="
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'swjtu|NAMES'

            echo "========== 清理 =========="
            docker image prune -f 2>&1
            docker system prune -f --volumes 2>/dev/null || true

            echo "========== ✅ 部署完成 =========="
