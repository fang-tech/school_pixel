name: Deploy to Server

on:
  push:
    branches: [main]

# 强制使用 Node.js 24，解决 deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "[1/4] Checkout 代码"
        uses: actions/checkout@v4

      - name: "[2/4] 配置 SSH 密钥"
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: "[3/4] Rsync 推送代码到服务器"
        run: |
          rsync -av --delete \
            --partial \
            --partial-dir=.rsync-partial \
            --delay-updates \
            --timeout=300 \
            --exclude 'node_modules' \
            --exclude 'appdata' \
            --exclude 'data.db*' \
            --exclude '.git' \
            --exclude '.DS_Store' \
            --exclude '.rsync-partial' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || 22 }}" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/swjtu-pixel-maker/
          echo "✅ 代码推送完成"

      - name: "[4/4] 远程重建并启动容器"
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_BUILDKIT: 1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            echo "========== 进入项目目录 =========="
            cd ~/swjtu-pixel-maker
            
            echo "========== 备份数据库 =========="
            mkdir -p ~/backup
            cp appdata/data.db ~/backup/data-$(date +%Y%m%d-%H%M%S).db 2>/dev/null || echo "⚠️ 无数据库备份"
            
            echo "========== 停止旧容器 =========="
            docker compose down 2>&1
            
            echo "========== 构建新镜像（带缓存）=========="
            export DOCKER_BUILDKIT=1
            docker compose build 2>&1
            
            echo "========== 启动新容器 =========="
            docker compose up -d 2>&1
            
            echo "========== 健康检查 =========="
            sleep 5
            curl -sf http://localhost:3000/ && echo "✅ 服务健康" || (echo "❌ 健康检查失败" && exit 1)
            
            echo "========== 容器状态 =========="
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'swjtu|NAMES'
            
            echo "========== 清理 =========="
            docker image prune -f 2>&1
            docker system prune -f --volumes 2>/dev/null || true
            
            echo "========== ✅ 部署完成 =========="
